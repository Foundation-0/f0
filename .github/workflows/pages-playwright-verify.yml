name: pages-playwright-verify
# Temporary PR check: same Playwright install as pages build, without deploy or Pages API.
on:
  pull_request: {}

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright 1.56.1 and its Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Smoke launch (same browser path as prerender)
        run: node -e "const { chromium } = require('playwright'); (async () => { const b = await chromium.launch(); await b.close(); console.log('chromium ok'); })();"
