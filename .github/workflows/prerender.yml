name: prerender
# PR check: re-bake the no-JavaScript copy of every data-rendered part of the site (scripts/prerender.mjs)
# and run the site gate on the fresh output. Read-only: it never commits, so a broken page script fails
# the PR instead of the next Pages deploy. The script serves docs/ itself and blocks every request
# outside it, so this job needs no network beyond installing Playwright.
on:
  pull_request:
    paths: &prerender-paths
      - 'docs/data/**'
      - 'docs/**/*.js'
      - '.github/workflows/prerender.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-24.04   # Playwright 1.56.1 has no chromium build for ubuntu26.04 (ubuntu-latest)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright 1.56.1 and its Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium

      - name: Prerender the data-rendered parts into the HTML
        run: node scripts/prerender.mjs
        env:
          PRERENDER_CHROMIUM: playwright   # use Playwright's own Chromium, not a local path

      - name: Site gate (links, page metadata, ledger schema)
        run: python3 scripts/check_site.py
