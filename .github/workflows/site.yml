name: site
# Gate every change to the Foundation0 site and the kappa-race pipeline.
# The Python gates read only repository files; browser-smoke downloads pinned tooling.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Site gate (ledger schema, data lists, links, page metadata, no third-party scripts)
        run: python3 scripts/check_site.py

      - name: Kappa feed gate (schema, determinism, selected-result binding, separation)
        run: python3 scripts/gate.py

      - name: Golden parser cases
        run: python3 tests/run_golden.py

      - name: Finding regressions F1-F5
        run: python3 tests/run_regressions.py

      - name: Gate corruption probes
        run: python3 tests/run_gate_corruptions.py

      - name: Forum index (fetch script against canned answers, gate against corrupted copies)
        run: python3 tests/run_discussions.py

  browser-smoke:
    # Exercise the same pinned toolchain as Pages without deploying or committing output.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install locked browser tooling and verify bundled dependencies
        run: npm ci --ignore-scripts && node scripts/check_browser_toolchain.mjs
      - name: Install the pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the forum prerender with the pinned Chromium
        run: node scripts/prerender.mjs --check docs/forum/index.html
        env:
          PRERENDER_CHROMIUM: playwright
