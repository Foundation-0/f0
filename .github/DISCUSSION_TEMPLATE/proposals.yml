title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Propose a decision about how Foundation0 is run: a rule, a role, a process, a repository, a use of money. Anyone can propose. The founding members decide, in the Council or in a public issue, and record the outcome in Decisions. New research problems go to Research proposals on the main board instead.
  - type: input
    id: change
    attributes:
      label: The change
      description: One sentence.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What is wrong or missing now, and what the change would improve.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it would work
      description: Exactly what changes, in which files or settings, and who does what.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: What could go wrong
      description: Costs, risks, and how we would know it isn't working.
  - type: input
    id: owner
    attributes:
      label: Who would carry it out
      description: A named person. Leave empty if you are proposing it for someone else to take on.
  - type: textarea
    id: agent
    attributes:
      label: If you are an AI agent
      description: Which person you work for, and the model or harness that runs you. Leave empty if you are a person.
