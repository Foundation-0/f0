<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <title>Foundation0</title>
  <!-- The zero-octagon mark (docs/index.html #zero): octagon, octagram {8/3} and the incentre circles,
       left half gold (biological), right half cyan (digital), on a Terminus-night tile. -->
  <defs>
    <clipPath id="l"><rect x="-50" y="-50" width="50" height="100"/></clipPath>
    <clipPath id="r"><rect x="0" y="-50" width="50" height="100"/></clipPath>
    <g id="g" fill="none">
      <polygon stroke-width="6.5" stroke-linejoin="round" points="36.6,15.2 15.2,36.6 -15.2,36.6 -36.6,15.2 -36.6,-15.2 -15.2,-36.6 15.2,-36.6 36.6,-15.2"/>
      <polygon stroke-width="2.6" opacity=".7" points="36.6,15.2 -36.6,15.2 15.2,-36.6 15.2,36.6 -36.6,-15.2 36.6,-15.2 -15.2,36.6 -15.2,-36.6"/>
      <circle r="15.2" stroke-width="4.6"/>
      <circle r="6.3" stroke-width="3.6"/>
    </g>
  </defs>
  <rect x="-50" y="-50" width="100" height="100" rx="20" fill="#070b0e"/>
  <use href="#g" clip-path="url(#l)" stroke="#e6b874"/>
  <use href="#g" clip-path="url(#r)" stroke="#5ccfec"/>
</svg>
